name: Package and release EGcare

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version approved in the release PR (must match ReleaseVersion.props on main)'
        required: true
        type: string
      build_number:
        description: 'Build approved in the release PR (0 uses ReleaseVersion.props on main)'
        default: 0
        type: number
      publish_release:
        description: 'Publish this release in the repository (otherwise build review artifacts only)'
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: egcare-production-release
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      version: ${{ steps.inputs.outputs.version }}
      build: ${{ steps.inputs.outputs.build }}
      feed: ${{ steps.inputs.outputs.feed }}
      publish: ${{ steps.inputs.outputs.publish }}
      previous: ${{ steps.inputs.outputs.previous }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate release version, branch and public feed
        id: inputs
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_VERSION: ${{ inputs.version }}
          REQUESTED_BUILD: ${{ inputs.build_number }}
          REQUESTED_PUBLISH: ${{ inputs.publish_release }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:GITHUB_EVENT_NAME -ne 'workflow_dispatch' -or $env:GITHUB_REF -ne 'refs/heads/main') { throw 'Run production packaging manually from main.' }
          . ./scripts/ReleaseVersion.ps1
          $tracked = Get-GitReleaseVersion HEAD
          Assert-ReleaseInputs $tracked $env:REQUESTED_VERSION $env:REQUESTED_BUILD
          $version = $tracked.Version
          $build = $tracked.Build
          $main = git rev-parse origin/main
          if ($LASTEXITCODE -ne 0 -or $main -ne $env:GITHUB_SHA) { throw 'Main changed after this run was requested. Run again from the current main branch.' }
          $headers = @{ Authorization = "Bearer $env:GH_TOKEN"; 'X-GitHub-Api-Version' = '2022-11-28' }
          $repo = Invoke-RestMethod "https://api.github.com/repos/$env:GITHUB_REPOSITORY" -Headers $headers
          if ($repo.private) { throw 'Anonymous app updates require this release repository to be public. Never embed a GitHub token in EGcare.' }
          $pulls = Invoke-RestMethod "https://api.github.com/repos/$env:GITHUB_REPOSITORY/commits/$env:GITHUB_SHA/pulls?per_page=100" -Headers $headers
          $approved = @($pulls | Where-Object { $_.merged_at -and $_.base.ref -eq 'main' -and $_.head.ref -eq 'development' -and $_.head.repo.full_name -eq $env:GITHUB_REPOSITORY -and $_.merge_commit_sha -eq $env:GITHUB_SHA })
          if (!$approved.Count) { throw 'Main must be the merge commit of a development-to-main release PR. Merge the release PR before running this workflow.' }
          $previousMain = Get-GitReleaseVersion 'HEAD^1' -AllowMissing
          $release = Invoke-WebRequest "https://api.github.com/repos/$env:GITHUB_REPOSITORY/releases/latest" -Headers $headers -SkipHttpErrorCheck
          $previous = ''
          if ($release.StatusCode -eq 200) {
            $tag = ($release.Content | ConvertFrom-Json).tag_name
            if ($tag -notmatch '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$') { throw "Unexpected previous stable release tag: $tag" }
            $previous = $tag.Substring(1)
            if ([version]$version -le [version]$previous) { throw "Version must be newer than $previous." }
          } elseif ($release.StatusCode -ne 404) { throw "Cannot read release history: HTTP $($release.StatusCode)." }
          $existing = Invoke-WebRequest "https://api.github.com/repos/$env:GITHUB_REPOSITORY/releases/tags/v$version" -Headers $headers -SkipHttpErrorCheck
          if ($existing.StatusCode -ne 404) { throw 'This release already exists, or release lookup failed. Existing releases are never overwritten.' }
          Assert-ReleaseTransition $tracked $previousMain -AllowUnpublishedRepair
          $publish = $env:REQUESTED_PUBLISH -eq 'true'
          "version=$version" >> $env:GITHUB_OUTPUT
          "build=$build" >> $env:GITHUB_OUTPUT
          "feed=https://github.com/$env:GITHUB_REPOSITORY/releases/latest/download" >> $env:GITHUB_OUTPUT
          "publish=$($publish.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          "previous=$previous" >> $env:GITHUB_OUTPUT
          @"
          ### Approved release parameters
          - Branch: main
          - Version: $version
          - Build: $build
          - Publish: $publish
          - Release PR: $($approved[0].html_url)
          "@ >> $env:GITHUB_STEP_SUMMARY

  verify:
    needs: validate
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  package:
    needs: [validate, verify]
    runs-on: windows-latest
    outputs:
      signed: ${{ steps.pack.outputs.signed }}
    env:
      RELEASE_VERSION: ${{ needs.validate.outputs.version }}
      RELEASE_BUILD: ${{ needs.validate.outputs.build }}
      RELEASE_FEED: ${{ needs.validate.outputs.feed }}
      PREVIOUS_VERSION: ${{ needs.validate.outputs.previous }}
      PUBLISH_RELEASE: ${{ needs.validate.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet workload install maui-windows
      - run: dotnet tool restore
      - name: Publish the self-contained Windows application
        shell: pwsh
        run: |
          dotnet publish src/Desktop/RadiologyCenter.Desktop/RadiologyCenter.Desktop.csproj `
            -c Release -f net10.0-windows10.0.19041.0 -r win-x64 --self-contained true `
            -p:WindowsPackageType=None -p:WindowsAppSDKSelfContained=true -p:EgcareSecurityAudit=true `
            "-p:ApplicationDisplayVersion=$env:RELEASE_VERSION" "-p:ApplicationVersion=$env:RELEASE_BUILD" `
            "-p:AssemblyVersion=$env:RELEASE_VERSION.0" "-p:FileVersion=$env:RELEASE_VERSION.0" `
            "-p:UpdateFeedUrl=$env:RELEASE_FEED" -o artifacts/app
          if ($LASTEXITCODE -ne 0) { throw 'Application publication failed.' }
          ./scripts/Assert-ReleasePayload.ps1 -AppDirectory artifacts/app
      - name: Download the previous release for delta updates
        if: needs.validate.outputs.previous != ''
        shell: pwsh
        run: |
          dotnet tool run vpk download http --url "$env:RELEASE_FEED" -o artifacts/release
          if ($LASTEXITCODE -ne 0) { throw 'Previous release download failed; do not silently package against a missing feed.' }
      - name: Pack and optionally sign with Velopack
        id: pack
        shell: pwsh
        env:
          EGCARE_SIGN_TEMPLATE: ${{ secrets.EGCARE_SIGN_TEMPLATE }}
          EGCARE_SIGN_PFX_BASE64: ${{ secrets.EGCARE_SIGN_PFX_BASE64 }}
          EGCARE_SIGN_PFX_PASSWORD: ${{ secrets.EGCARE_SIGN_PFX_PASSWORD }}
        run: |
          $ErrorActionPreference = 'Stop'
          $packArguments = @('pack','-u','RadiologyCenter','--packTitle','EGcare','-v',$env:RELEASE_VERSION,
            '-p','artifacts/app','--mainExe','RadiologyCenter.Desktop.exe','--channel','win',
            '--icon','src/Desktop/RadiologyCenter.Desktop/Resources/taskbar.ico','-o','artifacts/release')
          $cert = $null; $pfx = $null
          try {
            if ($env:EGCARE_SIGN_PFX_BASE64 -and $env:EGCARE_SIGN_TEMPLATE) { throw 'Configure one signing method, not both.' }
            if ($env:EGCARE_SIGN_PFX_BASE64) {
              $pfx = Join-Path $env:RUNNER_TEMP ('EGcare-sign-' + [guid]::NewGuid().ToString('N') + '.pfx')
              [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:EGCARE_SIGN_PFX_BASE64))
              $password = ConvertTo-SecureString $env:EGCARE_SIGN_PFX_PASSWORD -AsPlainText -Force
              $cert = Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $password
              if (@($cert).Count -ne 1 -or !$cert.HasPrivateKey) { throw 'Provide one code-signing certificate with its private key.' }
              $packArguments += @('--signParams', "/sha1 $($cert.Thumbprint) /s My /fd SHA256 /tr https://timestamp.digicert.com /td SHA256")
            } elseif ($env:EGCARE_SIGN_TEMPLATE) {
              $packArguments += @('--signTemplate', $env:EGCARE_SIGN_TEMPLATE)
            } else { Write-Output 'No signing certificate configured. Building an unsigned release.' }
            dotnet tool run vpk @packArguments
            if ($LASTEXITCODE -ne 0) { throw 'Velopack packaging failed.' }
            if ($cert -or $env:EGCARE_SIGN_TEMPLATE) {
              ./scripts/Assert-ReleaseSignatures.ps1 -ReleaseDirectory artifacts/release -Version $env:RELEASE_VERSION
              'signed=true' >> $env:GITHUB_OUTPUT
            } else {
              'signed=false' >> $env:GITHUB_OUTPUT
            }
          } finally {
            if ($cert) { $cert | ForEach-Object { Remove-Item -LiteralPath $_.PSPath -Force } }
            if ($pfx -and (Test-Path -LiteralPath $pfx)) { Remove-Item -LiteralPath $pfx -Force }
          }
          Copy-Item docs/lan-deployment.md,docs/deployment-pipeline.md artifacts/release/
          Copy-Item scripts/Publish-ClinicUpdateFeed.ps1,scripts/Assert-ReleaseSignatures.ps1,scripts/Assert-ReleaseChecksums.ps1,scripts/New-ClinicConfiguration.ps1,scripts/OrthancReadOnly.lua artifacts/release/
          Get-ChildItem artifacts/release -File | Sort-Object Name | ForEach-Object { "$((Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant())  $($_.Name)" } | Set-Content artifacts/release/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: EGcare-win-${{ needs.validate.outputs.version }}
          path: artifacts/release/
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: [validate, package]
    if: needs.validate.outputs.publish == 'true'
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_VERSION: ${{ needs.validate.outputs.version }}
      RELEASE_SIGNED: ${{ needs.package.outputs.signed }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: EGcare-win-${{ needs.validate.outputs.version }}
          path: artifacts/release
      - name: Verify release files and publish atomically
        shell: pwsh
        run: |
          ./scripts/Assert-ReleaseChecksums.ps1 -ReleaseDirectory artifacts/release
          if ($env:RELEASE_SIGNED -eq 'true') {
            ./scripts/Assert-ReleaseSignatures.ps1 -ReleaseDirectory artifacts/release -Version $env:RELEASE_VERSION
          } elseif ($env:RELEASE_SIGNED -ne 'false') { throw 'Package signing status is missing or invalid.' }
          $headers = @{ Authorization = "Bearer $env:GH_TOKEN"; 'X-GitHub-Api-Version' = '2022-11-28' }
          $latest = Invoke-WebRequest "https://api.github.com/repos/$env:GITHUB_REPOSITORY/releases/latest" -Headers $headers -SkipHttpErrorCheck
          if ($latest.StatusCode -eq 200) {
            $tag = ($latest.Content | ConvertFrom-Json).tag_name
            if ($tag -notmatch '^v\d+\.\d+\.\d+$' -or [version]$env:RELEASE_VERSION -le [version]$tag.Substring(1)) { throw 'A newer or equal version was already published.' }
          } elseif ($latest.StatusCode -ne 404) { throw 'Cannot safely verify the latest release.' }
          $assets = @(Get-ChildItem artifacts/release -File | ForEach-Object { $_.FullName })
          $notes = Join-Path $env:RUNNER_TEMP 'egcare-release-notes.txt'
          @"
          EGcare $env:RELEASE_VERSION for Windows x64.

          Code signed: $env:RELEASE_SIGNED.

          Built from $env:GITHUB_REPOSITORY at $env:GITHUB_SHA. Includes the .NET runtime.
          Install RadiologyCenter-win-Setup.exe. Existing installations check this release feed automatically.
          Offline clinics can distribute the same feed using Publish-ClinicUpdateFeed.ps1.
          For database-changing releases, fully exit every client and run backed-up admin maintenance before reconnecting.
          "@ | Set-Content -LiteralPath $notes
          gh release create "v$env:RELEASE_VERSION" @assets --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --draft --title "EGcare $env:RELEASE_VERSION" --notes-file $notes
          if ($LASTEXITCODE -ne 0) { throw 'Draft creation/upload failed. Existing releases are never overwritten.' }
          gh release edit "v$env:RELEASE_VERSION" --repo $env:GITHUB_REPOSITORY --draft=false --latest
          if ($LASTEXITCODE -ne 0) { throw 'Publication failed; inspect the draft and retry deliberately.' }
