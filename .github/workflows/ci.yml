name: Verify application

on:
  pull_request:
  push:
    branches: [main, development]
  workflow_call:

permissions:
  contents: read

jobs:
  release-version:
    name: Compare release versions
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require a newer release from development
        shell: pwsh
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_BRANCH: ${{ github.head_ref }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:HEAD_BRANCH -ne 'development' -or $env:HEAD_REPOSITORY -ne $env:GITHUB_REPOSITORY) { throw 'Production releases must use a development-to-main PR in this repository.' }
          . ./scripts/ReleaseVersion.ps1
          $production = Get-GitReleaseVersion $env:BASE_SHA -AllowMissing
          $candidate = Get-GitReleaseVersion $env:HEAD_SHA
          Assert-ReleaseTransition $candidate $production
          $previous = if ($production) { "$($production.Version) (build $($production.Build))" } else { 'No tracked release yet' }
          @"
          ### Release comparison
          - Main: $previous
          - Development: $($candidate.Version) (build $($candidate.Build))
          - After merging, manually run Package and release EGcare from main.
          - Inputs: version=$($candidate.Version), build_number=$($candidate.Build), publish_release=false for review or true for signed publication.
          "@ >> $env:GITHUB_STEP_SUMMARY
  backend:
    runs-on: ubuntu-latest
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: Y
          MSSQL_SA_PASSWORD: 'IntegrationOnly@2026Strong!'
        ports: [1433:1433]
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'IntegrationOnly@2026Strong!' -C -Q 'SELECT 1'"
          --health-interval 10s --health-timeout 5s --health-retries 20
    env:
      RADIOLOGY_TEST_CONNECTION_STRING: 'Server=localhost,1433;User ID=sa;Password=IntegrationOnly@2026Strong!;TrustServerCertificate=True'
      EGCARE_DIRECT_TEST_SQL_SERVER: 'localhost,1433'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Test all backend modules
        shell: pwsh
        run: ./scripts/Test-Backend.ps1 -ResultsDirectory test-results
      - name: Test release version policy
        shell: pwsh
        run: ./scripts/Test-ReleaseVersion.ps1
      - name: Test desktop startup lifecycle
        run: dotnet test src/Desktop/RadiologyCenter.Desktop.StartupTests/RadiologyCenter.Desktop.StartupTests.csproj -c Release --logger "trx;LogFileName=desktop-startup.trx" --results-directory test-results
      - name: Test desktop forms and validation
        run: dotnet test src/Desktop/RadiologyCenter.Desktop.ComponentTests/RadiologyCenter.Desktop.ComponentTests.csproj -c Release --logger "trx;LogFileName=desktop-components.trx" --results-directory test-results
      - name: Enable contained users on the isolated CI database server
        run: docker exec ${{ job.services.sqlserver.id }} /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'IntegrationOnly@2026Strong!' -C -Q "EXEC sp_configure 'contained database authentication', 1; RECONFIGURE;"
      - name: Verify direct database accounts and clinical workflows
        run: dotnet test src/Clinic/RadiologyCenter.Clinic.IntegrationTests/RadiologyCenter.Clinic.IntegrationTests.csproj -c Release --logger "trx;LogFileName=direct-security.trx" --results-directory test-results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-test-results
          path: test-results/*.trx
  desktop:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet workload install maui-windows
      - name: Audit desktop dependencies (including transitive packages)
        run: dotnet restore src/Desktop/RadiologyCenter.Desktop/RadiologyCenter.Desktop.csproj --force-evaluate -p:EgcareSecurityAudit=true
      - run: dotnet build src/Desktop/RadiologyCenter.Desktop/RadiologyCenter.Desktop.csproj -c Release -f net10.0-windows10.0.19041.0
      - name: Verify release payload and offline feed safeguards
        shell: pwsh
        run: ./scripts/Test-ReleaseTooling.ps1
